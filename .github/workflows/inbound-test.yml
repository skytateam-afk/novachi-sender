name: Inbound test
on:
  push:
    branches: [tmp/inbound-test]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - env:
          BYPASS: ${{ secrets.VERCEL_BYPASS }}
          BASE: ${{ secrets.ENGINE_URL }}
        run: |
          sleep 5
          echo "Preflight:"; curl -s -o /dev/null -w "%{http_code}\n" -X OPTIONS -H "x-vercel-protection-bypass: $BYPASS" -H "Origin: https://www.novachigroup.com" "https://www.novachiengine.net/api/inbound"
          echo "Test lead:"
          date -u +%T
          curl -s -X POST "https://www.novachiengine.net/api/inbound" -H "x-vercel-protection-bypass: $BYPASS" -H "Content-Type: application/json" -H "Origin: https://www.novachigroup.com" \
            -w "\nHTTP %{http_code}\n" -o out.txt -d '{"brand":"qivo","name":"Princess Udeani","email":"princess@gettruvasse.com","phone":"+14049173101","company":"Novachi Group","country":"United States","message":"Speed to lead test. I would like a Qivo demo for my team.","source":"go-live test"}'
          head -c 300 out.txt; echo; grep -o "<title>[^<]*" out.txt; date -u +%T
